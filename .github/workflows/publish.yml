name: Publish package

on:
  workflow_dispatch:

concurrency:
  group: publish-package
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.package.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up package managers
        run: |
          npm install --global npm@11.5.1
          corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check

      - name: Validate package version
        id: package
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          release_tag="v${package_version}"

          if [[ "${package_version}" == "0.0.0" ]]; then
            echo "::error::Bump package.json from 0.0.0 before publishing."
            exit 1
          fi

          if git rev-parse --quiet --verify "refs/tags/${release_tag}" >/dev/null; then
            echo "::error::Git tag ${release_tag} already exists."
            exit 1
          fi

          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "::error::${package_name}@${package_version} is already published."
            exit 1
          fi

          echo "version=${package_version}" >> "${GITHUB_OUTPUT}"

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Publish package
        run: npm publish

  release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ needs.publish.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          gh release create "${RELEASE_TAG}" \
            --target "${TARGET_SHA}" \
            --title "${RELEASE_TAG}" \
            --generate-notes
